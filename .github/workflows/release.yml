name: Release

# Builds per-OS installers + portable archives and publishes them to a GitHub
# Release. Triggered by pushing a `vX.Y.Z` tag — bump build/config.yml's
# info.version and build/linux/nfpm/nfpm.yaml's version first (see
# docs/RELEASING.md), then `git tag vX.Y.Z && git push origin vX.Y.Z`.
#
# Linux and Windows are built for both amd64 and arm64. macOS is arm64
# (the hosted runner). Windows arm64 is a pure-Go cross-compile on the x86
# runner; Linux arm64 builds natively on an arm64 runner (the build is CGO).
#
# Code signing on every OS is best-effort: each signing step is skipped
# (artifacts stay unsigned/ad-hoc-signed) unless the matching secrets are
# configured. See docs/RELEASING.md for exactly which secrets enable which
# step — nothing here fails the build for their absence.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  WAILS3_VERSION: v3.0.0-beta.16

jobs:
  linux:
    name: Package (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      HAS_PGP_KEY: ${{ secrets.LINUX_PGP_PRIVATE_KEY != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Linux system dependencies (GTK4 + WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Package (AppImage + deb + rpm + Arch)
        run: wails3 task linux:package

      - name: Sign .deb/.rpm with PGP
        if: env.HAS_PGP_KEY == 'true'
        env:
          PGP_PRIVATE_KEY: ${{ secrets.LINUX_PGP_PRIVATE_KEY }}
          PGP_PASSWORD: ${{ secrets.LINUX_PGP_PASSWORD }}
        run: |
          set -euo pipefail
          key="$(mktemp)"
          printf '%s' "$PGP_PRIVATE_KEY" > "$key"
          shopt -s nullglob
          for f in bin/*.deb bin/*.rpm; do
            echo "Signing $f"
            wails3 tool sign -input "$f" -pgp-key "$key" ${PGP_PASSWORD:+-pgp-password "$PGP_PASSWORD"}
          done
          shred -u "$key" 2>/dev/null || rm -f "$key"

      - name: Portable archive + arch-tag the packages
        run: |
          set -euo pipefail
          cd bin
          tar -czf "playlist-ai-linux-${{ matrix.arch }}.tar.gz" -- playlist-ai
          # nfpm names the deb/rpm/pkg after -name only (no arch), so the two
          # matrix legs would collide when the publish job merges them.
          arch='${{ matrix.arch }}'
          [ -f playlist-ai.deb ]         && mv playlist-ai.deb         "playlist-ai-${arch}.deb"
          [ -f playlist-ai.rpm ]         && mv playlist-ai.rpm         "playlist-ai-${arch}.rpm"
          [ -f playlist-ai.pkg.tar.zst ] && mv playlist-ai.pkg.tar.zst "playlist-ai-${arch}.pkg.tar.zst"
          ls -la

      - uses: actions/upload-artifact@v6
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            bin/*.AppImage
            bin/*.deb
            bin/*.rpm
            bin/*.pkg.tar.zst
            bin/playlist-ai-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Package (macOS)
    runs-on: macos-latest
    env:
      HAS_APPLE_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_SIGNING_IDENTITY != '' && 'true' || 'false' }}
      HAS_NOTARY_CREDS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Import Developer ID certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="build.keychain"
          keychain_pw="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

          cert="$(mktemp).p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$cert"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pw" "$keychain"
          rm -f "$cert"

      - name: Store notarization credentials
        if: env.HAS_APPLE_CERT == 'true' && env.HAS_NOTARY_CREDS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "playlistai-notary" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "build.keychain"

      - name: Package (.app bundle, ad-hoc signed)
        run: wails3 task darwin:package

      - name: Sign with Developer ID
        if: env.HAS_APPLE_CERT == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # --options runtime (hardened runtime) and --timestamp are both
          # required for the binary to be notarization-eligible.
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" "bin/playlist-ai.app"
          codesign --verify --deep --strict "bin/playlist-ai.app"

      - name: Notarize and staple
        if: env.HAS_APPLE_CERT == 'true' && env.HAS_NOTARY_CREDS == 'true'
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "bin/playlist-ai.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --keychain-profile "playlistai-notary" --keychain "build.keychain" --wait
          xcrun stapler staple "bin/playlist-ai.app"

      - name: Build the .dmg from the (possibly signed) .app
        run: wails3 task darwin:create:dmg

      - name: Portable archive (.app bundle)
        run: ditto -c -k --sequesterRsrc --keepParent "bin/playlist-ai.app" "bin/playlist-ai-macos.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: macos-packages
          path: |
            bin/*.dmg
            bin/playlist-ai-macos.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Package (Windows ${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Install NSIS (makensis) — not on the runner image
        shell: pwsh
        run: |
          choco install nsis --no-progress --no-color --yes
          $dir = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$dir\makensis.exe")) { $dir = "C:\Program Files\NSIS" }
          if (-not (Test-Path "$dir\makensis.exe")) {
            throw "makensis.exe not found after 'choco install nsis'"
          }
          & "$dir\makensis.exe" /VERSION
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      # winget consumes this NSIS installer (InstallerType: nullsoft). It
      # supports /S (silent) and registers a QuietUninstallString, so
      # `winget install` / `winget uninstall` work unattended.
      - name: Package (NSIS installer, ${{ matrix.arch }})
        run: wails3 task windows:package ARCH=${{ matrix.arch }}

      - name: Sign the installer with Authenticode
        if: env.HAS_CERT == 'true'
        shell: bash
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          cert="$(mktemp).pfx"
          printf '%s' "$WINDOWS_CERTIFICATE_PFX" | base64 --decode > "$cert"
          shopt -s nullglob
          for f in bin/*.exe; do
            echo "Signing $f"
            wails3 tool sign -input "$f" -certificate "$cert" -password "$WINDOWS_CERTIFICATE_PASSWORD" \
              -timestamp "http://timestamp.digicert.com"
          done
          rm -f "$cert"

      - name: Portable archive (raw binary)
        shell: bash
        run: |
          cd bin
          7z a "playlist-ai-windows-${{ matrix.arch }}.zip" "playlist-ai.exe"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-packages-${{ matrix.arch }}
          path: |
            bin/*-installer.exe
            bin/playlist-ai-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -la dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: true

  winget:
    name: winget manifests
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Render winget manifests + attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          # The release is still a draft here, so hash the installers via the
          # authenticated API rather than the public download URL.
          gh release download "$TAG" --dir dl \
            --pattern 'playlist-ai-amd64-installer.exe' \
            --pattern 'playlist-ai-arm64-installer.exe'
          amd64_sha="$(sha256sum dl/playlist-ai-amd64-installer.exe | cut -d' ' -f1 | tr 'a-f' 'A-F')"
          arm64_sha="$(sha256sum dl/playlist-ai-arm64-installer.exe | cut -d' ' -f1 | tr 'a-f' 'A-F')"

          base="https://github.com/platten/playlistai/releases/download/${TAG}"
          out="winget-out"; mkdir -p "$out"
          for f in build/windows/winget/*.yaml; do
            sed -e "s|<VERSION>|${version}|g" \
                -e "s|<RELEASE_DATE>|$(date -u +%Y-%m-%d)|g" \
                -e "s|<AMD64_URL>|${base}/playlist-ai-amd64-installer.exe|g" \
                -e "s|<AMD64_SHA256>|${amd64_sha}|g" \
                -e "s|<ARM64_URL>|${base}/playlist-ai-arm64-installer.exe|g" \
                -e "s|<ARM64_SHA256>|${arm64_sha}|g" \
                "$f" > "$out/$(basename "$f")"
          done
          echo "---- rendered installer manifest ----"; cat "$out/platten.PlaylistAI.installer.yaml"
          ( cd "$out" && zip -q "../platten.PlaylistAI-${version}-winget.zip" ./*.yaml )
          gh release upload "$TAG" "platten.PlaylistAI-${version}-winget.zip" --clobber
