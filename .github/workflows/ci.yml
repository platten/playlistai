name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  WAILS3_VERSION: v3.0.0-beta.16
  GOLANGCI_LINT_VERSION: v2.13.2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Linux system dependencies (GTK4 + WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Generate frontend bindings
        run: wails3 generate bindings -ts -clean=true

      - name: Build frontend (needed for go:embed)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::gofmt needs to be run on:"; echo "$out"; exit 1
          fi

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: go test
        run: go test -race -count=1 ./...

  wails-build:
    name: Wails build (${{ matrix.os }})
    needs: lint-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Linux system dependencies (GTK4 + WebKitGTK 6.0)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Install NSIS (makensis) — not on the runner image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress --no-color --yes
          $dir = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$dir\makensis.exe")) { $dir = "C:\Program Files\NSIS" }
          if (-not (Test-Path "$dir\makensis.exe")) {
            throw "makensis.exe not found after 'choco install nsis'"
          }
          & "$dir\makensis.exe" /VERSION
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Validate Windows contributor scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\test.ps1 -NoRace

      - name: Build
        if: runner.os != 'Windows'
        run: wails3 build

      # Windows runs the actual release commands so CI catches packaging breaks
      # (a missing makensis, a broken arm64 syso) before a tag is cut. Both
      # arches are cross-compiled here on the x86 runner.
      - name: Build + package (NSIS installer, amd64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1 -Architecture amd64

      - name: Build + package (NSIS installer, arm64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1 -Architecture arm64

      - uses: actions/upload-artifact@v6
        with:
          name: playlist-ai-${{ matrix.os }}
          path: bin/*
          if-no-files-found: error
          retention-days: 7
