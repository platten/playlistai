name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows_benchmark:
        description: Run only the Windows job for a controlled timing experiment
        type: boolean
        default: false
      windows_package_parallelism:
        description: Package concurrency for the Windows experiment
        type: choice
        options: [default, '1', '2', '4']
        default: default
      windows_test_mode:
        description: Separate or combined race and coverage for the Windows experiment
        type: choice
        options: [separate, combined]
        default: separate
      windows_cache:
        description: Cache strategy for the Windows experiment
        type: choice
        options: [standard, refreshed]
        default: standard

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.9"
  WAILS3_VERSION: v3.0.0-beta.16
  GOLANGCI_LINT_VERSION: v2.13.2

concurrency:
  # Explicit benchmark repetitions may overlap; they never cancel PR/main runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.windows_benchmark && github.run_id || 'validation' }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & test (linux)
    if: ${{ !inputs.windows_benchmark }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Linux system dependencies (GTK4 + WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Generate frontend bindings
        run: wails3 generate bindings -ts -clean=true

      - name: Build frontend (needed for go:embed)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm test
          pnpm run build:bundle

      - name: CI timing helper
        run: node --test scripts/go-test.test.mjs

      - name: go vet
        run: go vet ./...

      - name: Application-only release assets
        run: bash scripts/test-release-assets.sh

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::gofmt needs to be run on:"; echo "$out"; exit 1
          fi

      - name: golangci-lint
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: go test
        run: node scripts/go-test.mjs coverage/race-tests -race -count=1 ./...

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: go-timings-linux-lint
          path: coverage/
          retention-days: 14

  wails-build:
    name: Wails build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_benchmark && '["windows-latest"]' || '["ubuntu-latest","ubuntu-24.04-arm","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CI_WINDOWS_TEST_MODE: ${{ inputs.windows_benchmark && inputs.windows_test_mode || 'combined' }}
      CI_WINDOWS_PACKAGE_PARALLELISM: ${{ inputs.windows_benchmark && inputs.windows_package_parallelism || 'default' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ runner.os != 'Windows' || !inputs.windows_benchmark || inputs.windows_cache != 'refreshed' }}

      - name: Windows experiment cache identity
        if: runner.os == 'Windows' && inputs.windows_benchmark && inputs.windows_cache == 'refreshed'
        id: windows-cache
        shell: pwsh
        run: |
          $goVersion = go env GOVERSION
          $compilerHash = (Get-FileHash scripts/install-clap-toolchain.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $depsHash = (Get-FileHash go.sum -Algorithm SHA256).Hash.ToLowerInvariant()
          $prefix = "windows-go-v1-$env:ImageOS-$env:ImageVersion-$env:RUNNER_ARCH-$goVersion-$compilerHash-$depsHash-"
          "prefix=$prefix" >> $env:GITHUB_OUTPUT
          # At most one new snapshot per compatible configuration per day.
          "key=$prefix$([DateTime]::UtcNow.ToString('yyyy-MM-dd'))" >> $env:GITHUB_OUTPUT
          "build=$(go env GOCACHE)" >> $env:GITHUB_OUTPUT
          "modules=$(go env GOMODCACHE)" >> $env:GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        if: steps.windows-cache.outputs.key != ''
        id: windows-cache-restore
        with:
          path: |
            ${{ steps.windows-cache.outputs.build }}
            ${{ steps.windows-cache.outputs.modules }}
          key: ${{ steps.windows-cache.outputs.key }}
          restore-keys: ${{ steps.windows-cache.outputs.prefix }}

      - uses: pnpm/action-setup@v5
        if: runner.os != 'Windows'
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install pnpm (official Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install-pnpm.ps1 -Version $env:PNPM_VERSION

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Linux system dependencies (GTK4 + WebKitGTK 6.0)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Install NSIS (makensis) — not on the runner image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress --no-color --yes
          $dir = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$dir\makensis.exe")) { $dir = "C:\Program Files\NSIS" }
          if (-not (Test-Path "$dir\makensis.exe")) {
            throw "makensis.exe not found after 'choco install nsis'"
          }
          & "$dir\makensis.exe" /VERSION
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Install native CLAP build compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install-clap-toolchain.ps1

      - name: Validate Windows contributor scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '1'
          $env:CC = & .\scripts\install-clap-toolchain.ps1 -Architecture amd64 -CheckOnly
          $packageParallelism = if ($env:CI_WINDOWS_PACKAGE_PARALLELISM -eq 'default') { 0 } else { [int]$env:CI_WINDOWS_PACKAGE_PARALLELISM }
          .\scripts\test.ps1 -TestReportDirectory coverage -HostCoverage:($env:CI_WINDOWS_TEST_MODE -eq 'combined') -PackageParallelism $packageParallelism

      - name: Build
        if: runner.os != 'Windows'
        run: wails3 build

      # Windows runs the actual release commands so CI catches packaging breaks
      # (a missing makensis, a broken arm64 syso) before a tag is cut. Both
      # arches are cross-compiled here on the x86 runner.
      - name: Build + package (NSIS installer, amd64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/stage-nlu-runtime.py --arch amd64 --seven-zip "C:/Program Files/7-Zip/7z.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\build.ps1 -Architecture amd64

      - name: Build + package (NSIS installer, arm64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/stage-nlu-runtime.py --arch arm64 --seven-zip "C:/Program Files/7-Zip/7z.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\build.ps1 -Architecture arm64

      # Measure the host build separately. Cross-compiling an installer does not
      # exercise its native code, and these reports are not a claim of 95%.
      - name: Host Go coverage (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p coverage
          go env GOOS GOARCH CGO_ENABLED CC > coverage/build-environment.txt
          node scripts/go-test.mjs coverage/coverage-tests -count=1 -coverpkg=./... -covermode=atomic -coverprofile=coverage/backend.out ./...
          go tool cover -func=coverage/backend.out > coverage/backend-summary.txt
          go test -count=1 -tags production -coverprofile=coverage/production-build.out ./build

      - name: Host Go coverage (Windows amd64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '1'
          $env:CC = & .\scripts\install-clap-toolchain.ps1 -Architecture amd64 -CheckOnly
          New-Item -ItemType Directory -Force coverage | Out-Null
          go env GOOS GOARCH CGO_ENABLED CC | Set-Content coverage/build-environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:CI_WINDOWS_TEST_MODE -ne 'combined') {
            $testArgs = @('-count=1', '-coverpkg=./...', '-covermode=atomic', '-coverprofile=coverage/backend.out')
            if ($env:CI_WINDOWS_PACKAGE_PARALLELISM -ne 'default') { $testArgs += @('-p', $env:CI_WINDOWS_PACKAGE_PARALLELISM) }
            node scripts/go-test.mjs coverage/coverage-tests @testArgs ./...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          go tool cover '-func=coverage/backend.out' | Set-Content coverage/backend-summary.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 -tags production '-coverprofile=coverage/production-build.out' ./build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows experiment cache inventory
        if: always() && steps.windows-cache.outputs.key != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force coverage | Out-Null
          $inventory = foreach ($cachePath in @((go env GOCACHE), (go env GOMODCACHE))) {
            $files = Get-ChildItem -LiteralPath $cachePath -Recurse -File -ErrorAction Stop | Measure-Object -Property Length -Sum
            @{ path = $cachePath; files = $files.Count; bytes = $files.Sum }
          }
          $inventory | ConvertTo-Json | Set-Content coverage/cache-inventory.json

      - uses: actions/cache/save@v4
        if: success() && steps.windows-cache.outputs.key != '' && steps.windows-cache-restore.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ steps.windows-cache.outputs.build }}
            ${{ steps.windows-cache.outputs.modules }}
          key: ${{ steps.windows-cache.outputs.key }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: go-coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v6
        with:
          name: playlist-ai-${{ matrix.os }}
          path: |
            bin/playlist-ai
            bin/playlist-ai.exe
            bin/playlist-ai.app
            bin/playlist-ai-amd64-installer.exe
            bin/playlist-ai-arm64-installer.exe
          if-no-files-found: error
          retention-days: 7

  ci-complete:
    # A partial manual benchmark must never satisfy the full required check.
    name: ${{ inputs.windows_benchmark && 'Windows benchmark complete' || 'CI complete' }}
    if: always()
    needs: [lint-test, wails-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          LINT_RESULT: ${{ needs.lint-test.result }}
          PLATFORM_RESULT: ${{ needs.wails-build.result }}
          WINDOWS_BENCHMARK: ${{ inputs.windows_benchmark && 'true' || 'false' }}
        run: |
          if [[ "$WINDOWS_BENCHMARK" == "true" ]]; then
            [[ "$LINT_RESULT" == "skipped" && "$PLATFORM_RESULT" == "success" ]]
          else
            [[ "$LINT_RESULT" == "success" && "$PLATFORM_RESULT" == "success" ]]
          fi
