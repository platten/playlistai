# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "playlist-ai"
arch: ${GOARCH}
platform: "linux"
# Keep in sync with build/config.yml's info.version (re-run
# `wails3 update build-assets` after bumping it, then reapply the fields below —
# that command doesn't know about section/maintainer/homepage/license).
version: "0.1.0"
section: "sound"
priority: "extra"
maintainer: "Playlist AI authors <https://github.com/platten/playlistai>"
description: "Local-first playlist recommendations over the Deej-AI embedding catalog."
vendor: "Playlist AI"
homepage: "https://github.com/platten/playlistai"
license: "GPL-3.0-only"
release: "1"

contents:
  - src: "./bin/playlist-ai"
    dst: "/usr/local/bin/playlist-ai"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/playlist-ai.png"
  - src: "./build/linux/playlist-ai.desktop"
    dst: "/usr/share/applications/playlist-ai.desktop"
  # Bundled llama-server runtime (build/llama/fetch.sh, run automatically by
  # `task linux:package`) — must land in the same directory as playlist-ai
  # itself; that's where internal/intent/llama's resolveBinary() looks first.
  - src: "./bin/llama-server"
    dst: "/usr/local/bin/llama-server"
  - src: "./bin/*.so*"
    dst: "/usr/local/bin/"
  # Compressed catalog (build/Taskfile.yml's stage:catalog, run automatically
  # by `task linux:package`) — a real archive if a local catalog build
  # existed at package time, otherwise a 0-byte placeholder. nfpm needs a
  # fixed path here (a glob errors out on zero matches, unlike the *.so*
  # entry above, which fetch:llama guarantees at least one match for), so
  # stage:catalog always writes *something* to this path. See
  # internal/dataset.FindBundledArchive and docs/CATALOG.md.
  - src: "./bin/catalog.tar.zst"
    dst: "/usr/local/bin/catalog.tar.zst"
  - src: "./bin/licenses/*"
    dst: "/usr/share/doc/playlist-ai/"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
